name: Deploy Ooga Chat staging

# Ooga Chat's staging edge (docs/ooga-chat-backend.md), by hand. It never redeploys the island's Worker: deploy
# oogaboogaland-staging (its ChatBridge entrypoint) first with cloudflare-staging.yml when the bridge changed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ooga-chat-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      # The standalone app (#651) into untracked/ooga-chat, the folder wrangler.ooga-chat.staging.jsonc serves.
      - name: Build and stage the app
        run: npm run build:ooga-chat
      - name: Install Worker dependencies
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        run: node --test "worker/test/*.test.mjs"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: d1 migrations apply DB --remote --config wrangler.ooga-chat.staging.jsonc
      - name: Deploy staging edge
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: deploy --config wrangler.ooga-chat.staging.jsonc
